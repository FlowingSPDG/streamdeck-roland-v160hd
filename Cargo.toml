[package]
name = "streamdeck-roland-v160hd"
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Shugo Kawamura <ruk1ium@gmail.com>"]
description = "Stream Deck plugin for Roland V-160HD"
repository = "https://github.com/MikanseiLaboratory/streamdeck-roland-v160hd"
publish = false

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# V-160HD VER framing + 06H ACK / STX DTH: https://github.com/FlowingSPDG/roland-rs/pull/11
roland-rs = { git = "https://github.com/FlowingSPDG/roland-rs", rev = "02c21d9af6ee6c6a37c3fb6c00335a78adc2332e", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-rs = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
