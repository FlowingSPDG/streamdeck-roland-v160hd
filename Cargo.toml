[package]
name = "streamdeck-roland-v160hd"
version = "0.0.0"
edition = "2021"
license = "MIT"
authors = ["Shugo Kawamura"]
description = "Stream Deck plugin for Roland V-160HD"
publish = false

[[bin]]
name = "plugin"
path = "src/main.rs"

[dependencies]
futures = "0.3"
# V-160HD VER framing fixes: https://github.com/FlowingSPDG/roland-rs/pull/11
roland-rs = { git = "https://github.com/FlowingSPDG/roland-rs", rev = "554bf0b6f8c4f6a6b7d9aa29bbe8edcb130d3899", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
streamdeck-rs = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
