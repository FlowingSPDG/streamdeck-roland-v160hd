name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin | Out-Null
          Copy-Item target/release/plugin.exe plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin/plugin.exe

      - name: Build macOS universal
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin
          lipo -create -output plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin/plugin \
            target/aarch64-apple-darwin/release/plugin \
            target/x86_64-apple-darwin/release/plugin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: plugin/com.flowingspdg.roland.v160hd.sdPlugin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble plugin zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PLUGIN=com.flowingspdg.roland.v160hd.sdPlugin
          rm -rf dist
          mkdir -p "dist/${PLUGIN}/bin"
          cp -R plugin/${PLUGIN}/. "dist/${PLUGIN}/"
          WIN_EXE=$(find artifacts/windows -name plugin.exe | head -n 1)
          MAC_BIN=$(find artifacts/macos -path '*/bin/plugin' | head -n 1)
          cp "$WIN_EXE" "dist/${PLUGIN}/bin/plugin.exe"
          cp "$MAC_BIN" "dist/${PLUGIN}/bin/plugin"
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ["TAG"].lstrip("v")
          path = pathlib.Path("dist/com.flowingspdg.roland.v160hd.sdPlugin/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["Version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          chmod +x "dist/${PLUGIN}/bin/plugin"
          cd dist
          zip -r "../${PLUGIN}.zip" "${PLUGIN}"

      - name: Determine release channel
        id: channel
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)(\.[0-9]+)?$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported tag '${TAG}'. Use vX.Y.Z for a Release, or vX.Y.Z-alpha.N / vX.Y.Z-beta.N / vX.Y.Z-rc.N for a Pre-release."
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "${{ github.ref_name }}"
            "com.flowingspdg.roland.v160hd.sdPlugin.zip"
            --repo "${{ github.repository }}"
            --title "${{ github.ref_name }}"
            --generate-notes
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
