name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: streamdeck-roland-v160hd
    steps:
      - uses: actions/checkout@v4
        with:
          path: streamdeck-roland-v160hd

      - uses: actions/checkout@v4
        with:
          repository: FlowingSPDG/roland-rs
          path: roland-rs
          ref: feature/tokio-async-client

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release

      - name: Stage Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin | Out-Null
          Copy-Item target/release/plugin.exe plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin/plugin.exe

      - name: Build macOS universal
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin
          lipo -create -output plugin/com.flowingspdg.roland.v160hd.sdPlugin/bin/plugin \
            target/aarch64-apple-darwin/release/plugin \
            target/x86_64-apple-darwin/release/plugin

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: streamdeck-roland-v160hd/plugin/com.flowingspdg.roland.v160hd.sdPlugin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: streamdeck-roland-v160hd

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble plugin zip
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          PLUGIN=com.flowingspdg.roland.v160hd.sdPlugin
          rm -rf dist
          mkdir -p "dist/${PLUGIN}/bin"
          cp -R streamdeck-roland-v160hd/plugin/${PLUGIN}/. "dist/${PLUGIN}/"
          WIN_EXE=$(find artifacts/windows -name plugin.exe | head -n 1)
          MAC_BIN=$(find artifacts/macos -path '*/bin/plugin' | head -n 1)
          cp "$WIN_EXE" "dist/${PLUGIN}/bin/plugin.exe"
          cp "$MAC_BIN" "dist/${PLUGIN}/bin/plugin"
          python3 - <<'PY'
          import json, os, pathlib
          version = os.environ["TAG"].lstrip("v")
          path = pathlib.Path("dist/com.flowingspdg.roland.v160hd.sdPlugin/manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["Version"] = version
          path.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY
          chmod +x "dist/${PLUGIN}/bin/plugin"
          cd dist
          zip -r "../${PLUGIN}.zip" "${PLUGIN}"
          if [[ "${VERSION}" == *-* ]]; then
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${PRERELEASE}" = "true" ]; then
            gh release create "${{ github.ref_name }}" \
              "com.flowingspdg.roland.v160hd.sdPlugin.zip" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --prerelease \
              --generate-notes
          else
            gh release create "${{ github.ref_name }}" \
              "com.flowingspdg.roland.v160hd.sdPlugin.zip" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
